<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер по скетчу</title>
    <style>
        /* ... ВСЕ СТИЛИ ОСТАЮТСЯ БЕЗ ИЗМЕНЕНИЙ (я их скрыл для краткости, но они на месте) ... */
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 20px; background-color: #f4f4f4; height: 100vh; display: flex; justify-content: center; transition: background-color 0.3s, color 0.3s; overflow: hidden; }
        .app-container { display: flex; width: 100%; max-width: 1200px; height: 100%; gap: 10px; position: relative; }
        .sidebar { width: 300px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.3s ease-in-out; z-index: 100; }
        .create-chat-btn { padding: 15px; font-size: 16px; background: white; border: 3px solid black; border-radius: 15px; cursor: pointer; font-weight: bold; transition: transform 0.1s, background 0.3s, border-color 0.3s, color 0.3s; }
        .create-chat-btn:active { transform: scale(0.98); }
        .chat-list-container { flex: 1; border: 3px solid black; border-radius: 15px; padding: 10px; background: white; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .chat-list-header { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid black; padding-bottom: 5px; }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .chat-list::-webkit-scrollbar { width: 8px; } .chat-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; } .chat-list::-webkit-scrollbar-thumb { background: black; border-radius: 10px; }
        .chat-item { padding: 12px; border: 2px solid black; border-radius: 12px; cursor: pointer; background: white; transition: background 0.2s, border-color 0.3s, color 0.3s; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .chat-item:hover { background: #e0e0e0; } .chat-item.active { background: #d0e8ff; border-width: 3px; }
        .chat-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-chat-btn { font-size: 18px; font-weight: bold; color: black; cursor: pointer; padding: 0 5px; border-radius: 50%; line-height: 1; transition: color 0.2s, background 0.2s; }
        .delete-chat-btn:hover { color: red; background-color: #ffcccc; }
        .sidebar-footer { border: 3px solid black; border-radius: 15px; background: white; padding: 15px; display: flex; flex-direction: column; gap: 15px; transition: background 0.3s, border-color 0.3s; }
        .username-container { display: flex; flex-direction: column; gap: 5px; }
        .username-container input { padding: 10px; border: 3px solid black; border-radius: 10px; background: white; font-size: 16px; outline: none; }
        .switch-row { display: flex; justify-content: space-between; align-items: center; }
        .physical-switch { width: 55px; height: 55px; border: 4px solid black; padding: 3px; background: white; cursor: pointer; transition: background 0.3s, border-color 0.3s; }
        .switch-inner { width: 100%; height: 100%; border: 4px solid black; background: white; position: relative; overflow: hidden; }
        .switch-block { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: #d3d3d3; border-top: 3px solid black; transition: transform 0.2s ease-in-out, background 0.2s; }
        .physical-switch.active .switch-block { transform: translateY(-100%); border-top: none; border-bottom: 3px solid black; background: #333; }
        .chat-area { flex: 1; border: 3px solid black; border-radius: 15px; background: white; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .chat-header { padding: 10px 15px; border-bottom: 3px solid black; display: flex; justify-content: space-between; align-items: center; background: #fdfdfd; min-height: 60px; }
        .mobile-chats-btn { display: none; padding: 8px 15px; background: white; border: 3px solid black; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .chat-title { font-weight: bold; font-size: 18px; }
        .empty-state { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #555; text-align: center; padding: 20px; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 10px 15px; border: 2px solid black; border-radius: 15px; font-size: 16px; background: white; align-self: flex-start; display: flex; flex-direction: column; word-break: break-word; }
        .message.own { align-self: flex-end; background: #e0f7fa; }
        .message-sender { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 3px; }
        .message.own .message-sender { text-align: right; color: #00796b; }
        .input-area { display: flex; padding: 10px; gap: 10px; border-top: 2px solid transparent; }
        .input-area input { flex: 1; padding: 15px; border: 3px solid black; border-radius: 15px; font-size: 16px; outline: none; width: 100%; }
        .input-area button { padding: 0 20px; border: 3px solid black; border-radius: 15px; background: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border: 3px solid black; border-radius: 15px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content input { padding: 12px; border: 3px solid black; border-radius: 10px; font-size: 16px; outline: none; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 10px; border: 3px solid black; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; background: white; }
        body.dark-mode { background-color: #000000; color: white; }
        body.dark-mode .create-chat-btn, body.dark-mode .chat-list-container, body.dark-mode .chat-item, body.dark-mode .sidebar-footer, body.dark-mode .username-container input, body.dark-mode .chat-header, body.dark-mode .chat-area, body.dark-mode .input-area input, body.dark-mode .input-area button, body.dark-mode .modal-content, body.dark-mode .modal-content input, body.dark-mode .modal-actions button, body.dark-mode .mobile-chats-btn { background-color: #1a1a1a; color: white; border-color: white; }
        body.dark-mode .message { background-color: #2a2a2a; color: white; border-color: white; }
        body.dark-mode .message.own { background-color: #004d40; border-color: white; }
        body.dark-mode .message-sender { color: #aaaaaa; } body.dark-mode .message.own .message-sender { color: #88ddcc; }
        body.dark-mode .empty-state { color: #aaaaaa; } body.dark-mode .delete-chat-btn { color: white; }
        body.dark-mode .delete-chat-btn:hover { color: red; background-color: #330000; }
        body.dark-mode .chat-item:hover { background-color: #333333; } body.dark-mode .chat-item.active { background-color: #003366; }
        body.dark-mode .physical-switch, body.dark-mode .switch-inner { background-color: #000000; border-color: white; }
        body.dark-mode .switch-block { background-color: #333333; border-color: white; }
        body.dark-mode .physical-switch.active .switch-block { background-color: white; }
        @media (max-width: 768px) {
            body { padding: 0; } .app-container { height: 100dvh; gap: 0; }
            .sidebar { position: fixed; top: 0; left: -100%; width: 85%; max-width: 320px; height: 100dvh; background: #f4f4f4; padding: 10px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; } .chat-area { border-radius: 0; border: none; border-left: 3px solid black; width: 100%; }
            .mobile-chats-btn { display: block; } .chat-header { justify-content: flex-start; gap: 15px; } .message { max-width: 85%; }
            .input-area { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
            .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
            .sidebar-overlay.active { display: block; } body.dark-mode .sidebar { background: #000; border-right: 3px solid white; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <button class="create-chat-btn" id="createChatBtn">создать / войти</button>
            <div class="chat-list-container">
                <div class="chat-list-header">Чаты</div>
                <div class="chat-list" id="chatList"></div>
            </div>
            <div class="sidebar-footer">
                <div class="username-container">
                    <label>Ваш ник:</label>
                    <input type="text" id="usernameInput" placeholder="Введите имя..." autocomplete="off">
                </div>
                <div class="switch-row">
                    <span>Тёмная тема</span>
                    <div class="physical-switch" id="themeToggle">
                        <div class="switch-inner"><div class="switch-block"></div></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <div id="emptyState" class="empty-state">Не открыт ни один из чатов</div>
            <div class="chat-header" id="chatHeader" style="display: none;">
                <button class="mobile-chats-btn" id="mobileChatsBtn">Чаты</button>
                <div class="chat-title" id="chatTitleDisplay">Название чата</div>
            </div>
            <div class="messages-container" id="messagesContainer" style="display: none;"></div>
            <div class="input-area" id="inputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
                <button id="sendBtn">></button>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="createChatModal">
        <div class="modal-content">
            <h3 style="margin:0; text-align:center;">Создать или войти в чат</h3>
            <input type="text" id="newChatNameInput" placeholder="Введите название комнаты..." autocomplete="off">
            <div class="modal-actions">
                <button id="cancelCreateBtn">Отмена</button>
                <button id="confirmCreateBtn">Открыть</button>
            </div>
        </div>
    </div>

    <!-- 1. Подключаем твой файл с ключами -->
    <script src="config.js"></script>
    
    <!-- 2. Подключаем библиотеку Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ==========================================
        // 3. БЕРЕМ КЛЮЧИ ИЗ CONFIG.JS
        // ==========================================
        let supabaseClient = null;
        try {
            // Берем переменные из файла config.js, который мы создали
            const supabaseUrl = window.MY_SUPABASE_URL;
            const supabaseKey = window.MY_SUPABASE_KEY;
            
            if (supabaseUrl && supabaseKey) {
                supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
            } else {
                console.warn("ВНИМАНИЕ: Не удалось найти ключи. Проверь файл config.js");
            }
        } catch (e) { console.error("Ошибка подключения Supabase:", e); }

        // ... ДАЛЬШЕ ИДЕТ ВЕСЬ ОСТАЛЬНОЙ JS КОД БЕЗ ИЗМЕНЕНИЙ ...
        let chats = [];
        let activeChatId = null;
        let currentChannel = null;
        const nameWords = ["бобик", "пупочек", "чебурек", "квантовый-огурец", "турбо-пельмень", "кринж-мастер"];

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const mobileChatsBtn = document.getElementById('mobileChatsBtn');
        
        const chatListEl = document.getElementById('chatList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const emptyState = document.getElementById('emptyState');
        const inputArea = document.getElementById('inputArea');
        const usernameInput = document.getElementById('usernameInput');
        const chatHeader = document.getElementById('chatHeader');
        const chatTitleDisplay = document.getElementById('chatTitleDisplay');
        
        const createChatBtn = document.getElementById('createChatBtn');
        const createChatModal = document.getElementById('createChatModal');
        const newChatNameInput = document.getElementById('newChatNameInput');
        const cancelCreateBtn = document.getElementById('cancelCreateBtn');
        const confirmCreateBtn = document.getElementById('confirmCreateBtn');
        const themeToggle = document.getElementById('themeToggle');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
        }

        mobileChatsBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        function generateRandomUsername() {
            return `${nameWords[Math.floor(Math.random() * nameWords.length)]}${Math.floor(Math.random() * 9999)}`;
        }

        function initUsername() {
            const savedName = localStorage.getItem('myChatName');
            usernameInput.value = savedName || generateRandomUsername();
            if (!savedName) localStorage.setItem('myChatName', usernameInput.value);
        }

        themeToggle.addEventListener('click', () => {
            themeToggle.classList.toggle('active');
            document.body.classList.toggle('dark-mode');
        });

        usernameInput.addEventListener('change', () => {
            localStorage.setItem('myChatName', usernameInput.value.trim());
        });

        createChatBtn.addEventListener('click', () => {
            createChatModal.style.display = 'flex';
            newChatNameInput.value = '';
            newChatNameInput.focus();
        });

        cancelCreateBtn.addEventListener('click', () => {
            createChatModal.style.display = 'none';
        });

        confirmCreateBtn.addEventListener('click', () => {
            const chatName = newChatNameInput.value.trim();
            if (chatName !== '') {
                if (!chats.find(c => c.id === chatName)) {
                    chats.push({ id: chatName, name: chatName });
                }
                createChatModal.style.display = 'none';
                selectChat(chatName);
            } else {
                alert("Введите название комнаты.");
            }
        });

        newChatNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmCreateBtn.click();
        });

        function updateRightPanel() {
            if (activeChatId === null) {
                emptyState.style.display = 'flex'; chatHeader.style.display = 'none';
                messagesContainer.style.display = 'none'; inputArea.style.display = 'none';
            } else {
                emptyState.style.display = 'none'; chatHeader.style.display = 'flex';
                messagesContainer.style.display = 'flex'; inputArea.style.display = 'flex';
            }
        }

        function renderChats() {
            chatListEl.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                div.innerHTML = `<span class="chat-name">${chat.name}</span><span class="delete-chat-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')">✕</span>`;
                div.onclick = () => {
                    selectChat(chat.id);
                    if(window.innerWidth <= 768) toggleSidebar();
                };
                chatListEl.appendChild(div);
            });
        }

        function selectChat(id) {
            activeChatId = id;
            const currentChat = chats.find(c => c.id === id);
            if (currentChat) { chatTitleDisplay.textContent = currentChat.name; }
            renderChats(); updateRightPanel();
            if (supabaseClient) { renderMessages(); setupRealtime(); }
        }

        window.deleteChat = function(id) {
            chats = chats.filter(chat => chat.id !== id);
            if (activeChatId === id) {
                activeChatId = null;
                if (currentChannel) supabaseClient.removeChannel(currentChannel);
            }
            renderChats(); updateRightPanel();
            if (activeChatId === null) messagesContainer.innerHTML = '';
        }

        function appendMessageToDOM(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.username === usernameInput.value.trim() ? 'own' : ''}`;
            msgDiv.innerHTML = `<div class="message-sender">${msg.username}</div><div>${msg.text}</div>`;
            messagesContainer.appendChild(msgDiv);
        }

        async function renderMessages() {
            messagesContainer.innerHTML = '';
            if (activeChatId === null || !supabaseClient) return;
            const { data, error } = await supabaseClient.from('messages').select('*').eq('chat_id', activeChatId.toString()).order('created_at', { ascending: true });
            if (error) { messagesContainer.innerHTML = `<div style="color:red;">Ошибка загрузки: ${error.message}</div>`; return; }
            data.forEach(msg => appendMessageToDOM(msg));
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function setupRealtime() {
            if (!supabaseClient) return;
            if (currentChannel) supabaseClient.removeChannel(currentChannel);
            currentChannel = supabaseClient.channel('room_' + activeChatId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${activeChatId}` }, 
                (payload) => {
                    appendMessageToDOM(payload.new);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }).subscribe();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || activeChatId === null || !supabaseClient) return;
            let currentName = usernameInput.value.trim() || generateRandomUsername();
            usernameInput.value = currentName;
            localStorage.setItem('myChatName', currentName);
            messageInput.value = '';
            const { error } = await supabaseClient.from('messages').insert({ 
                chat_id: activeChatId.toString(), username: currentName, text: text 
            });
            if (error) {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить сообщение.');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        initUsername();
        renderChats();
        updateRightPanel();
    </script>
</body>
</html>
