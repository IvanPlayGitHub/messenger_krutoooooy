<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анрей</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico"`
    <link rel="apple-touch-icon" href="favicon.ico">
    <style>
        :root {
            --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-speed: 0.3s;
        }

        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Arial', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; padding: 20px; background-color: #f4f4f4; height: 100vh; display: flex; justify-content: center; transition: background-color 0.4s ease, color 0.4s ease; overflow: hidden; }
        .app-container { display: flex; width: 100%; max-width: 1200px; height: 100%; gap: 10px; position: relative; }
        
        /* --- ВЕРСИЯ САЙТА --- */
        .site-version {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: white;
            color: black;
            border: 3px solid black;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10005;
            box-shadow: 0 2px 0 black;
            user-select: none;
            transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        body.dark-mode .site-version { background: #1a1a1a; color: white; border-color: white; box-shadow: 0 2px 0 white; }
        /* --- ЛОГОТИП --- */
        .logo-container {
            position: fixed; bottom: 45px; right: 15px; width: 150px; height: 150px; /* Перенесли влево и увеличили */
            z-index: 10005; cursor: pointer; user-select: none;
        }
        .logo-base {
            width: 100%; height: 100%; object-fit: contain;
            transition: transform 0.3s var(--ease-bounce);
        }
        .logo-container:active .logo-base { transform: scale(0.9); }
        
        .logo-popcorn {
            position: absolute; bottom: -10px; right: -10px; width: 40px; height: 40px;
            opacity: 0; transform: scale(0) translateY(10px);
            transition: all 0.4s var(--ease-bounce); pointer-events: none;
        }
        .logo-popcorn.show { opacity: 1; transform: scale(1) translateY(0); }

        .logo-dance-hand {
            position: absolute; top: 50%; left: -15px; width: 45px; height: 45px; /* Рука ближе */
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .logo-dance-hand.show { opacity: 1; animation: handTaunt 0.5s infinite alternate; }
        
        @keyframes handTaunt {
            from { transform: translateY(-50%) rotate(-15deg); }
            to { transform: translateY(-50%) rotate(15deg); }
        }

        @keyframes logoWobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .logo-wobble { animation: logoWobble 0.4s ease-in-out; }
        
        /* Фикс плавного разлетания платформ */
        .messages-container.game-active .message { transition: left 0.8s var(--ease-out), top 0s; }
        
        /* --- ЛЕВАЯ ПАНЕЛЬ --- */
        .sidebar { width: 300px; display: flex; flex-direction: column; gap: 10px; transition: transform var(--transition-speed) var(--ease-out); z-index: 100; background-color: #f4f4f4; }
        .create-chat-btn { padding: 15px; font-size: 16px; background: white; border: 3px solid black; border-radius: 15px; cursor: pointer; font-weight: bold; transition: transform var(--transition-speed) var(--ease-bounce), background-color 0.3s, border-color 0.3s, color 0.3s; }
        .create-chat-btn:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 4px 0 black; }
        .create-chat-btn:active { transform: scale(0.96) translateY(0); box-shadow: none; }
        
        .chat-list-container { flex: 1; border: 3px solid black; border-radius: 15px; padding: 10px; background: white; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .chat-list-header { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid black; padding-bottom: 5px; }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; scroll-behavior: smooth; }
        .chat-list::-webkit-scrollbar { width: 8px; } .chat-list::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; } .chat-list::-webkit-scrollbar-thumb { background: black; border-radius: 10px; }
        
        .chat-item { padding: 12px; border: 2px solid black; border-radius: 12px; cursor: pointer; background: white; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: transform 0.2s var(--ease-out), background 0.2s, border-color 0.3s, color 0.3s; position: relative; }
        .chat-item:hover { background: #e0e0e0; transform: translateX(4px); } 
        .chat-item.active { background: #d0e8ff; border-width: 3px; transform: translateX(4px); }
        
        .chat-name-wrapper { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
        .chat-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; font-weight: bold; }
        
        .unread-badge { background-color: #ff3b30; color: white; border: 2px solid black; border-radius: 10px; padding: 2px 7px; font-size: 12px; font-weight: bold; display: none; animation: popIn 0.3s var(--ease-bounce); }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .delete-chat-btn { font-size: 18px; font-weight: bold; color: black; cursor: pointer; padding: 0 5px; border-radius: 50%; line-height: 1; transition: color 0.2s, background 0.2s, transform 0.2s; user-select: none; }
        .delete-chat-btn:hover { color: red; background-color: #ffcccc; transform: rotate(90deg); }
        
        .sidebar-footer { border: 3px solid black; border-radius: 15px; background: white; padding: 15px; display: flex; flex-direction: column; gap: 15px; transition: background 0.3s, border-color 0.3s; }
        .username-container { display: flex; flex-direction: column; gap: 5px; }
        .username-container input { padding: 10px; border: 3px solid black; border-radius: 10px; background: white; font-size: 16px; outline: none; transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s; }
        .username-container input:focus { box-shadow: 0 0 0 3px rgba(0,0,0,0.1); }
        
        .switch-row { display: flex; justify-content: space-between; align-items: center; }
        .physical-switch { width: 55px; height: 55px; border: 4px solid black; padding: 3px; background: white; cursor: pointer; transition: background 0.3s, border-color 0.3s; }
        .switch-inner { width: 100%; height: 100%; border: 4px solid black; background: white; position: relative; overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .switch-block { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: #d3d3d3; border-top: 3px solid black; transition: transform 0.4s var(--ease-bounce), background 0.3s, border-color 0.3s; }
        .physical-switch.active .switch-block { transform: translateY(-100%); border-top: none; border-bottom: 3px solid black; background: #333; }

        .enable-notifications-btn { padding: 10px; background: #e0f7fa; border: 3px solid black; border-radius: 10px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; display: none; }
        .enable-notifications-btn:active { transform: scale(0.95); }

        /* --- ПРАВАЯ ПАНЕЛЬ (ЧАТ) --- */
        .chat-area { flex: 1; border: 3px solid black; border-radius: 15px; background: white; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .chat-header { padding: 10px 15px; border-bottom: 3px solid black; display: flex; align-items: center; gap: 15px; background: #fdfdfd; min-height: 60px; transition: background 0.3s, border-color 0.3s; }
        .mobile-chats-btn { display: none; padding: 8px 15px; background: white; border: 3px solid black; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: transform 0.2s var(--ease-bounce), background 0.3s, border-color 0.3s, color 0.3s; }
        .mobile-chats-btn:active { transform: scale(0.9); }
        .chat-title { font-weight: bold; font-size: 18px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        
        .participants-container { display: flex; flex-direction: row-reverse; gap: 5px; align-items: center; flex-shrink: 0; }
        .participant-avatar, .participant-more {
            width: 34px; height: 34px; border-radius: 50%; border: 3px solid black; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 14px; font-weight: bold; color: black;
            cursor: pointer; transition: transform 0.2s var(--ease-bounce), border-color 0.3s; 
            position: relative; z-index: 1; user-select: none; -webkit-user-select: none;
        }
        .participant-avatar { background-color: #fff; }
        .participant-more { background-color: #e0e0e0; font-size: 12px; }
        .participant-avatar:hover, .participant-more:hover { transform: translateY(-3px); z-index: 10; }

        /* --- КАСТОМНАЯ ПОДСКАЗКА --- */
        .custom-tooltip { position: fixed; background: white; color: black; border: 3px solid black; border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: bold; pointer-events: none; z-index: 10000; opacity: 0; transform: translateY(-10px) translateX(-50%); transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out); max-width: 250px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); word-wrap: break-word; }
        .custom-tooltip.show { opacity: 1; transform: translateY(0) translateX(-50%); }
        .custom-tooltip::after { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); border-width: 0 8px 8px 8px; border-style: solid; border-color: transparent transparent black transparent; }
        .custom-tooltip::before { content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); border-width: 0 6px 6px 6px; border-style: solid; border-color: transparent transparent white transparent; z-index: 1; }

        /* --- КАСТОМНОЕ КОНТЕКСТНОЕ МЕНЮ --- */
        .custom-context-menu { position: fixed; background: white; border: 3px solid black; border-radius: 12px; padding: 5px; display: none; flex-direction: column; z-index: 10001; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: menuFadeIn 0.15s var(--ease-out); min-width: 150px; }
        @keyframes menuFadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .custom-context-menu button { background: transparent; border: none; padding: 10px 15px; text-align: left; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; border-radius: 8px; transition: background 0.2s, color 0.2s; color: black; outline: none; }
        .custom-context-menu button:hover { background: #ffcccc; color: red; }

        .empty-state { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #555; text-align: center; padding: 20px; transition: color 0.3s; }
        
        /* --- КОНТЕЙНЕР СООБЩЕНИЙ И ИГРА --- */
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; position: relative; overflow-x: hidden; }
        .messages-container.game-active { overflow: hidden; }
        
        .messages-container.game-active .message {
            position: absolute;
            margin: 0;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 0 black; 
            z-index: 2;
        }

        @keyframes slideInMessage { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .message { max-width: 70%; padding: 10px 15px; border: 2px solid black; border-radius: 15px; font-size: 16px; background: white; align-self: flex-start; display: flex; flex-direction: column; word-break: break-word; transition: background 0.3s, border-color 0.3s, color 0.3s; animation: slideInMessage 0.3s var(--ease-out) forwards; }
        .message.own { align-self: flex-end; background: #e0f7fa; }
        .message-sender { font-size: 12px; font-weight: bold; color: #666; margin-bottom: 3px; }
        .message.own .message-sender { text-align: right; color: #00796b; }
        
        #frokCharacter {
            position: absolute;
            width: 50px;
            height: 50px;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: none;
            pointer-events: none;
        }
        
        .input-area { display: flex; padding: 10px; gap: 10px; border-top: 2px solid transparent; z-index: 5; background: white; transition: background 0.3s; }
        .input-area input { flex: 1; padding: 15px; border: 3px solid black; border-radius: 15px; font-size: 16px; outline: none; width: 100%; transition: background 0.3s, border-color 0.3s, color 0.3s; }
        
        .input-area button { padding: 0 15px; border: 3px solid black; border-radius: 15px; background: white; font-weight: bold; cursor: pointer; font-size: 18px; transition: transform 0.2s var(--ease-bounce), background 0.3s, border-color 0.3s, color 0.3s; }
        .input-area button:hover { transform: scale(1.05); } 
        .input-area button:active { transform: scale(0.95); }

        #gameBtn { font-size: 20px; padding: 0 15px; }
        #gameBtn.active { background: #ffcccc; transform: scale(1.1); box-shadow: 0 0 10px red; }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; padding: 20px; border: 3px solid black; border-radius: 15px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; transform: scale(0.8); transition: transform 0.3s var(--ease-bounce); }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-content input { padding: 12px; border: 3px solid black; border-radius: 10px; font-size: 16px; outline: none; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 10px; border: 3px solid black; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; background: white; transition: background 0.2s, transform 0.1s; }
        .modal-actions button:active { transform: scale(0.95); }

        /* --- ТЁМНАЯ ТЕМА --- */
        body.dark-mode { background-color: #000000; color: white; }
        body.dark-mode .sidebar { background-color: #000000; }
        body.dark-mode .create-chat-btn, body.dark-mode .chat-list-container, body.dark-mode .chat-item, body.dark-mode .sidebar-footer, body.dark-mode .username-container input, body.dark-mode .chat-header, body.dark-mode .chat-area, body.dark-mode .input-area input, body.dark-mode .input-area button, body.dark-mode .modal-content, body.dark-mode .modal-content input, body.dark-mode .modal-actions button, body.dark-mode .mobile-chats-btn, body.dark-mode .input-area { background-color: #1a1a1a; color: white; border-color: white; }
        body.dark-mode .unread-badge { border-color: white; }
        body.dark-mode .message { background-color: #2a2a2a; color: white; border-color: white; box-shadow: 0 4px 0 white; }
        body.dark-mode .message.own { background-color: #004d40; border-color: white; }
        body.dark-mode .message-sender { color: #aaaaaa; } body.dark-mode .message.own .message-sender { color: #88ddcc; }
        body.dark-mode .empty-state { color: #aaaaaa; } body.dark-mode .delete-chat-btn { color: white; }
        body.dark-mode .delete-chat-btn:hover { color: red; background-color: #330000; }
        body.dark-mode .chat-item:hover { background-color: #333333; } body.dark-mode .chat-item.active { background-color: #003366; }
        body.dark-mode .physical-switch, body.dark-mode .switch-inner { background-color: #000000; border-color: white; }
        body.dark-mode .switch-block { background-color: #333333; border-color: white; }
        body.dark-mode .physical-switch.active .switch-block { background-color: white; }
        body.dark-mode .participant-avatar { background-color: #333; color: white; border-color: white; }
        body.dark-mode .participant-more { background-color: #1a1a1a; color: white; border-color: white; }
        body.dark-mode .custom-tooltip { background-color: #333; color: white; border-color: white; }
        body.dark-mode .custom-tooltip::after { border-color: transparent transparent white transparent; }
        body.dark-mode .custom-tooltip::before { border-color: transparent transparent #333 transparent; }
        body.dark-mode .custom-context-menu { background: #1a1a1a; border-color: white; }
        body.dark-mode .custom-context-menu button { color: white; }
        body.dark-mode .custom-context-menu button:hover { background: #330000; color: red; }
        body.dark-mode .enable-notifications-btn { background: #004d40; color: white; border-color: white; }

        /* ========================================= */
        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
        /* ========================================= */
        @media (max-width: 768px) {
            body { padding: 0; } 
            .app-container { height: 100dvh; gap: 0; }
            .sidebar { position: fixed; top: 0; left: 0; width: 85%; max-width: 320px; height: 100dvh; padding: 10px; box-shadow: 4px 0 15px rgba(0,0,0,0.3); transform: translateX(-105%); }
            .sidebar.open { transform: translateX(0); } 
            .chat-area { border-radius: 0; border: none; border-left: 3px solid black; width: 100%; }
            body.dark-mode .chat-area { border-left-color: white; }
            .mobile-chats-btn { display: block; } 
            .chat-header { justify-content: flex-start; } 
            .message { max-width: 85%; }
            .input-area { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
            .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
            .sidebar-overlay.active { opacity: 1; visibility: visible; } 
            .participant-avatar, .participant-more { width: 28px; height: 28px; font-size: 12px; border-width: 2px; }
        }

        /* Стили для картинок в сообщениях */
        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            border: 2px solid black;
            cursor: pointer;
            display: block;
        }
        body.dark-mode .message img { border-color: white; }

    </style>
</head>
<body>
        <!-- Логотип -->
    <div class="logo-container" id="mainLogo">
        <img src="logo_assets/logo_idle.gif" id="logoImg" class="logo-base" alt="Logo">
        <img src="logo_assets/logo_popcorn.png" id="logoPopcorn" class="logo-popcorn" alt="Popcorn">
        <img src="logo_assets/logo_hand_taunt.gif" id="logoHand" class="logo-dance-hand" alt="Hand">
    </div>

    <!-- Версия сайта -->
    <div class="site-version">v0.0.8</div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="custom-tooltip" id="tooltip"></div>
    
    <div class="custom-context-menu" id="customContextMenu">
        <button id="ctxDeleteBtn">Удалить</button>
    </div>

    <audio id="notificationSound" src="notification.mp3" preload="auto"></audio>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <button class="create-chat-btn" id="createChatBtn">создать / войти</button>
            
            <div class="chat-list-container">
                <div class="chat-list-header">Чаты</div>
                <div class="chat-list" id="chatList"></div>
            </div>

            <div class="sidebar-footer">
                <div class="username-container">
                    <label>Ваш ник:</label>
                    <input type="text" id="usernameInput" placeholder="Введите имя..." autocomplete="off">
                </div>
                
                <button class="enable-notifications-btn" id="enableNotificationsBtn">Включить уведомления</button>

                <div class="switch-row">
                    <span>Тёмная тема</span>
                    <div class="physical-switch" id="themeToggle">
                        <div class="switch-inner"><div class="switch-block"></div></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <button class="mobile-chats-btn" id="mobileChatsBtn">Чаты</button>
                <div class="chat-title" id="chatTitleDisplay">Название чата</div>
                <div class="participants-container" id="participantsContainer"></div>
            </div>

            <div id="emptyState" class="empty-state">Не открыт ни один из чатов</div>
            
            <div class="messages-container" id="messagesContainer" style="display: none;">
                <img id="frokCharacter" src="frok.gif" alt="Frok">
            </div>

            <div class="input-area" id="inputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
                <button id="gameBtn" title="Режим Doodle Jump">🎮</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                <button id="uploadImageBtn" title="Отправить картинку">📷</button>
                <button id="sendBtn">></button>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="createChatModal">
        <div class="modal-content">
            <h3 style="margin:0; text-align:center;">Создать или войти в чат</h3>
            <input type="text" id="newChatNameInput" placeholder="Введите название комнаты..." autocomplete="off">
            <div class="modal-actions">
                <button id="cancelCreateBtn">Отмена</button>
                <button id="confirmCreateBtn">Открыть</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        let supabaseClient = null;
        try {
            const supabaseUrl = window.MY_SUPABASE_URL;
            const supabaseKey = window.MY_SUPABASE_KEY;
            if (supabaseUrl && supabaseKey) supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        } catch (e) { console.error("Ошибка подключения Supabase:", e); }

        // --- ЗВУК ---
        const notificationSound = document.getElementById('notificationSound');
        document.addEventListener('click', () => {
            if (notificationSound) {
                notificationSound.volume = 0;
                notificationSound.play().then(() => {
                    notificationSound.pause();
                    notificationSound.currentTime = 0;
                    notificationSound.volume = 1;
                }).catch(() => {});
            }
        }, { once: true });

        function playNotificationSound() {
            if (!notificationSound) return;
            try {
                notificationSound.currentTime = 0;
                notificationSound.play().catch(e => console.warn("Браузер заблокировал звук", e));
            } catch (e) { console.warn("Не удалось воспроизвести звук", e); }
        }

        // --- СИСТЕМНЫЕ УВЕДОМЛЕНИЯ ---
        const enableNotificationsBtn = document.getElementById('enableNotificationsBtn');
        if (!("Notification" in window)) {
            enableNotificationsBtn.style.display = 'none';
        } else if (Notification.permission === "granted") {

        function startGame() {
            if (!activeChatId || messagesContainer.querySelectorAll('.message').length === 0) {
                alert("Сначала отправьте хотя бы одно сообщение, чтобы было по чему прыгать!");
                return;
            }

            isGameActive = true;
            gameBtn.classList.add('active');
            messagesContainer.classList.add('game-active');
            logoPopcorn.classList.add('show');
            
            // Задаем высоту игрового мира
            const WORLD_HEIGHT = 2000;
            const containerWidth = messagesContainer.offsetWidth;
            const msgs = Array.from(messagesContainer.querySelectorAll('.message'));
            
            messagesContainer.style.height = `${WORLD_HEIGHT}px`;
            platforms = [];

            // Раскидываем сообщения по всей высоте случайным образом
            msgs.forEach((msg, index) => {
                // Высота платформы от 150 до 1800 (чтобы не на самом верху и не на самом дне)
                const randomTop = 200 + (index * 150) + Math.random() * 100; 
                const randomLeft = Math.random() * (containerWidth - msg.offsetWidth - 20) + 10;
                
                msg.style.position = 'absolute';
                msg.style.top = `${WORLD_HEIGHT - randomTop}px`; 
                msg.style.left = `${randomLeft}px`;
                msg.style.margin = '0';
                msg.style.width = `${msg.offsetWidth}px`;

                // Сохраняем для физики (Y считаем от нижнего края!)
                platforms.push({
                    el: msg,
                    x: randomLeft,
                    y: randomTop, // Высота от низа
                    width: msg.offsetWidth,
                    height: msg.offsetHeight
                });
            });

            frok.style.display = 'block';
            frokPhysics.x = (containerWidth / 2) - 25;
            frokPhysics.y = 100; // Лягушка появляется на высоте 100px от низа
            frokPhysics.vx = 0;
            frokPhysics.vy = 0;
            frokPhysics.rotation = 0;

            // МГНОВЕННО скроллим вниз, к лягушке
            messagesContainer.scrollTop = WORLD_HEIGHT - messagesContainer.clientHeight;

            cancelAnimationFrame(gameLoopId);
            gameLoop();
        
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            window.addEventListener('deviceorientation', handleTilt);
        }
        function stopGame() {
            if (!isGameActive) return;

            gameBtn.classList.remove('active');
            messagesContainer.classList.remove('game-active');

                msg.style.width = '';
                msg.style.margin = '';
            });

            document.removeEventListener('keydown', handleKeyDown);
            document.removeEventListener('keyup', handleKeyUp);
            window.removeEventListener('deviceorientation', handleTilt);
            
            platforms = [];
            messagesContainer.scrollTop = messagesContainer.scrollHeight; 
        }
        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.right = true;
        }
        function handleKeyUp(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.right = false;
        }
        
        function handleTilt(e) {
            if (e.gamma !== null) frokPhysics.vx += e.gamma * 0.05;
        }

        function gameLoop() {
            if (!isGameActive || !frok) return;

            const WORLD_HEIGHT = 2000;
            const frokSize = 50;
            const containerWidth = messagesContainer.offsetWidth;

            // Управление
            if (keys.left) frokPhysics.vx -= 1.5;
            if (keys.right) frokPhysics.vx += 1.5;
            frokPhysics.vx *= 0.9;
            
            if (frokPhysics.vx > 10) frokPhysics.vx = 10;
            if (frokPhysics.vx < -10) frokPhysics.vx = -10;

            frokPhysics.x += frokPhysics.vx;
            
            // Гравитация
            frokPhysics.vy -= frokPhysics.gravity;
            frokPhysics.y += frokPhysics.vy;

            // Границы по бокам
            if (frokPhysics.x < 0) { frokPhysics.x = 0; frokPhysics.vx = 0; }
            if (frokPhysics.x > containerWidth - frokSize) { frokPhysics.x = containerWidth - frokSize; frokPhysics.vx = 0; }

            // --- КОЛЛИЗИИ ---
            if (frokPhysics.vy < 0) { // Проверяем только когда падаем
                platforms.forEach(p => {
                    // Если ноги лягушки пересекают высоту платформы
                    if (frokPhysics.y >= p.y && frokPhysics.y <= p.y + 20) {
                        // И если по X они пересекаются
                        if (frokPhysics.x + frokSize > p.x && frokPhysics.x < p.x + p.width) {
                            frokPhysics.vy = frokPhysics.jumpPower; 
                        }
                    }
                });
            }

            // Если упал ниже низа, возрождаем наверху
            if (frokPhysics.y < -50) {
                frokPhysics.y = WORLD_HEIGHT - 100;
                frokPhysics.vy = 0;
            }

            // Сальтуха
            if (frokPhysics.vy > 0) frokPhysics.rotation += 12;
            else frokPhysics.rotation -= 3;

            // Двигаем лягушку
            frok.style.left = `${frokPhysics.x}px`;
            frok.style.bottom = `${frokPhysics.y}px`;
            frok.style.transform = `rotate(${frokPhysics.rotation}deg)`;

            // --- КАМЕРА ---
            // Нам нужно, чтобы лягушка всегда была в центре экрана по вертикали
            // Вычисляем, какой scrollTop нужен
            const targetScroll = (WORLD_HEIGHT - frokPhysics.y) - (messagesContainer.clientHeight / 2) + 25;
            
            // Применяем скролл (можно добавить плавность, если вместо = использовать += и делить разницу)
            messagesContainer.scrollTop = targetScroll;

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function selectChat(id) {
            if (isGameActive) stopGame();
            activeChatId = id;
            unreadCounts[id] = 0;
            saveState(); 
            updateTitle();
            
            const currentChat = chats.find(c => c.id === id);
            if (currentChat && chatTitleDisplay) { chatTitleDisplay.textContent = currentChat.name; }
            
            currentParticipants.clear();
            const myName = usernameInput.value.trim();
            if (myName) currentParticipants.add(myName);
            renderParticipantsList();

            renderChats(); 
            updateRightPanel();
            if (supabaseClient) { renderMessages(); }
        }

        window.deleteChat = function(id) {
            if (isGameActive) stopGame();
            chats = chats.filter(chat => chat.id !== id);
            delete unreadCounts[id];
            
            if (activeChatId === id) {
                activeChatId = null;
                currentParticipants.clear();
                renderParticipantsList();
            }
            saveState(); 
            updateTitle();
            
            renderChats(); 
            updateRightPanel();
            
            if (activeChatId === null) {
                Array.from(messagesContainer.children).forEach(child => {
                    if (child.id !== 'frokCharacter') child.remove();
                });
            }
        }

        function renderParticipantsList() {
            if (!participantsContainer) return;
            participantsContainer.innerHTML = '';
            let users = Array.from(currentParticipants);
            const myName = usernameInput.value.trim();

            users = users.filter(u => u !== myName);
            if (currentParticipants.has(myName)) users.unshift(myName);

            const maxVisible = 3;
            const visibleUsers = users.slice(0, maxVisible);
            const hiddenCount = users.length - maxVisible;

            visibleUsers.forEach(username => {
                const initial = username.charAt(0).toUpperCase();
                const avatar = document.createElement('div');
                avatar.className = 'participant-avatar';
                avatar.textContent = initial;
                
                avatar.addEventListener('mouseenter', () => showTooltip(avatar, username));
                avatar.addEventListener('mouseleave', hideTooltip);
                avatar.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    showTooltip(avatar, username);
                });
                participantsContainer.appendChild(avatar);
            });

            if (hiddenCount > 0) {
                const more = document.createElement('div');
                more.className = 'participant-more';
                more.textContent = `+${hiddenCount}`;
                const fullList = users.slice(maxVisible).join(', ');

                more.addEventListener('mouseenter', () => showTooltip(more, fullList));
                more.addEventListener('mouseleave', hideTooltip);
                more.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showTooltip(more, fullList);
                });
                participantsContainer.appendChild(more);
            }

        function appendMessageToDOM(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.username === usernameInput.value.trim() ? 'own' : ''}`;
            
            const senderDiv = document.createElement('div');
            senderDiv.className = 'message-sender';
            senderDiv.textContent = msg.username;
            
            const contentDiv = document.createElement('div');
            
            // Защита от XSS (чтобы нельзя было взломать через HTML-теги)
            let safeText = msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Ищем тег [img] и заменяем его на настоящую картинку с новой строки
            let finalHTML = safeText.replace(/\[img\](.*?)\[\/img\]/g, (match, url) => {
                return `<br><img src="${url}" alt="Картинка" loading="lazy">`;
            });

            contentDiv.innerHTML = finalHTML;

            msgDiv.appendChild(senderDiv);
            msgDiv.appendChild(contentDiv);
            messagesContainer.appendChild(msgDiv);
        }

        async function renderMessages() {
            Array.from(messagesContainer.children).forEach(child => {
                if (child.id !== 'frokCharacter') child.remove();
            });

            if (activeChatId === null || !supabaseClient) return;
            
            const { data, error } = await supabaseClient.from('messages').select('*').eq('chat_id', activeChatId.toString()).order('created_at', { ascending: true });
            
            if (error) { 
                const errDiv = document.createElement('div');
                errDiv.style.color = 'red';
                errDiv.textContent = `Ошибка загрузки: ${error.message}`;
                messagesContainer.appendChild(errDiv); 
                return; 
            }
            
            data.forEach(msg => {
                currentParticipants.add(msg.username);
                appendMessageToDOM(msg);
            });
            
            renderParticipantsList();
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function setupGlobalRealtime() {
            if (!supabaseClient) return;
            if (currentChannel) supabaseClient.removeChannel(currentChannel);
            
            currentChannel = supabaseClient.channel('global_room')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, 
                (payload) => {
                    const newMsg = payload.new;
                    const msgChatId = newMsg.chat_id;
                    const isMyMessage = newMsg.username === usernameInput.value.trim();

                    if (msgChatId === activeChatId) {
                        appendMessageToDOM(newMsg);
                        if (!currentParticipants.has(newMsg.username)) {
                            currentParticipants.add(newMsg.username);
                            renderParticipantsList();
                        }
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        
                        if (isGameActive) stopGame();
                    } else if (!isMyMessage) {
                        unreadCounts[msgChatId] = (unreadCounts[msgChatId] || 0) + 1;
                        saveState();
                        renderChats();
                        updateTitle();
                    }

                    if (!document.hasFocus() && !isMyMessage) {
                        playNotificationSound();
                        const chatName = chats.find(c => c.id === msgChatId)?.name || msgChatId;
                        showSystemNotification(`Новое сообщение в "${chatName}"`, `${newMsg.username}: ${newMsg.text}`, msgChatId);
                    }
                }).subscribe();
        }
        // --- ЗАГРУЗКА КАРТИНОК ---
        const imageInput = document.getElementById('imageInput');
        const uploadImageBtn = document.getElementById('uploadImageBtn');

        uploadImageBtn.addEventListener('click', () => imageInput.click());

                imageInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || activeChatId === null) return;

            uploadImageBtn.textContent = '⏳';
            
            // Запоминаем текст, который уже напечатан в поле ввода
            const textValue = messageInput.value.trim(); 

            const fileExt = file.name.split('.').pop().toLowerCase();
            const fileName = `${Date.now()}.${fileExt}`;
            const safeChatId = activeChatId.replace(/[^a-zA-Z0-9_-]/g, '_'); 
            const filePath = `${safeChatId}/${fileName}`; 

            const { error } = await supabaseClient.storage.from('chat-images').upload(filePath, file);

            if (error) {
                alert('Ошибка загрузки: ' + error.message);
                uploadImageBtn.textContent = '📷';
                return;
            }

            const { data: urlData } = supabaseClient.storage.from('chat-images').getPublicUrl(filePath);

            // Если текст был, приклеиваем картинку к нему. Если нет - отправляем только картинку.
            const finalText = textValue 
                ? `${textValue} [img]${urlData.publicUrl}[/img]` 
                : `[img]${urlData.publicUrl}[/img]`;

            let currentName = usernameInput.value.trim() || generateRandomUsername();
            
            await supabaseClient.from('messages').insert({ 
                chat_id: activeChatId.toString(), 
                username: currentName, 
                text: finalText
            });

            uploadImageBtn.textContent = '📷';
            imageInput.value = '';
            messageInput.value = ''; // Очищаем поле ввода после отправки
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === '' || activeChatId === null || !supabaseClient) return;
            let currentName = usernameInput.value.trim() || generateRandomUsername();
            usernameInput.value = currentName;
            localStorage.setItem('myChatName', currentName);
            messageInput.value = '';
            
            const { error } = await supabaseClient.from('messages').insert({ 
                chat_id: activeChatId.toString(), username: currentName, text: text 
            });
            if (error) {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить сообщение.');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function updateTitle() {
            const totalUnread = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
            if (totalUnread > 0 && !document.hasFocus()) {
                document.title = `(${totalUnread}) Новое сообщение!`;
            } else {
                document.title = originalTitle;
            }
        }

        window.addEventListener('focus', updateTitle);
        window.addEventListener('blur', updateTitle);
        document.addEventListener('visibilitychange', updateTitle);

        function saveState() {
            localStorage.setItem('mySavedChats', JSON.stringify(chats));
            localStorage.setItem('myUnreadCounts', JSON.stringify(unreadCounts));
            if (activeChatId) localStorage.setItem('myActiveChatId', activeChatId);
            else localStorage.removeItem('myActiveChatId');
        }

        // Старт
        const originalTitle = document.title;
        initUsername();
        renderChats();
        updateTitle();
        
        if (activeChatId && chats.find(c => c.id === activeChatId)) {
            selectChat(activeChatId);
        } else {
            activeChatId = null;
            saveState();
            updateRightPanel();
        }

        setupGlobalRealtime();
    </script>
</body>
</html>
